<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISETA - Instituto Superior Experimental de Tecnología Alimentaria</title>
  <!-- Iconos de FontAwesome para la lupa del buscador y las flechitas despliegan -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ENCABEZADO SUPERIOR -->
  <header class="top-header">
    <div class="container header-container">
      <!-- Logo de la institución -->
      <a href="#" class="logo-link">
        <img src="iseta_logo.png" alt="ISETA - Instituto Superior Experimental de Tecnología Alimentaria" class="logo-img">
      </a>

      <!-- Buscador superior -->
      <div class="search-box">
        <input type="text" placeholder="Buscar ...">
        <button type="submit" aria-label="Buscar">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="main-navbar">
    <div class="container">
      <ul class="nav-menu">
        <li class="nav-item dropdown">
          <a href="#">INSTITUCIONALES <i class="fa-solid fa-chevron-down"></i></a>
        </li>
        <li class="nav-item dropdown">
          <a href="#">DEPARTAMENTOS Y SERVICIOS <i class="fa-solid fa-chevron-down"></i></a>
        </li>
        <li class="nav-item dropdown">
          <a href="#">CARRERAS <i class="fa-solid fa-chevron-down"></i></a>
        </li>
        <li class="nav-item">
          <a href="#">AULA VIRTUAL</a>
        </li>
        <li class="nav-item">
          <a href="#">PRUEBAS DE SELECCIÓN</a>
        </li>
        <li class="nav-item">
          <a href="#">NOTICIAS</a>
        </li>
        <li class="nav-item">
          <a href="#">WEBMAIL</a>
        </li>
      </ul>
    </div>
  </nav>

</body>
</html>
